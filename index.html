 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0e17;
            color: #fffffe;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            margin-top: 55px; 
        }

        h1 {
            font-size: 1.8rem;
            color: #a7a9be;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #ff8906;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            gap: 15px;
        }

        .player-box {
            flex: 1;
            background-color: #16161a;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .player-box.active {
            border-color: #7f5af0;
            box-shadow: 0 0 15px rgba(127, 90, 240, 0.4);
        }

        .player-box .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0 auto 8px auto;
        }

        #p1-box .avatar { background-color: #7f5af0; color: #fff; }
        #p2-box .avatar { background-color: #2cb67d; color: #fff; }

        .player-name {
            font-size: 0.8rem;
            color: #94a1b2;
            margin-bottom: 2px;
        }

        .score {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fffffe;
        }

        .turn-indicator {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #7f5af0;
            color: #fffffe;
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-box.active .turn-indicator {
            opacity: 1;
        }

        #p2-box .turn-indicator {
            background-color: #2cb67d;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .card {
            aspect-ratio: 1;
            background-color: #16161a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #94a1b2;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s, background-color 0.3s;
            border: 1px solid #24242e;
        }

        .card.flipped {
            transform: rotateY(180deg);
            background-color: #24242e;
            color: #fffffe;
        }

        .card.matched {
            background-color: #00000000;
            border-color: transparent;
            color: transparent;
            visibility: hidden;
            pointer-events: none;
        }

        button {
            background-color: transparent;
            color: #94a1b2;
            border: 1px solid #24242e;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #24242e;
            color: #fffffe;
        }

        /* Custom Winner Modal Style */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #16161a;
            border: 2px solid #7f5af0;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(127, 90, 240, 0.5);
            max-width: 320px;
            width: 90%;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 2rem;
            color: #ff8906;
            margin-bottom: 15px;
        }

        .modal-content p {
            font-size: 1.2rem;
            color: #fffffe;
            margin-bottom: 25px;
        }

        .modal-btn {
            background-color: #7f5af0;
            color: #fffffe;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(127, 90, 240, 0.3);
            transition: all 0.2s;
        }

        .modal-btn:hover {
            background-color: #6b46c1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Memory Match</h1>
        <div class="subtitle">2 Player Puzzle Game</div>

        <div class="scoreboard">
            <div id="p1-box" class="player-box active">
                <div class="avatar">P1</div>
                <div class="player-name">Player 1</div>
                <div id="p1-score" class="score">0</div>
                <div class="turn-indicator">Your Turn</div>
            </div>
            <div id="p2-box" class="player-box">
                <div class="avatar">P2</div>
                <div class="player-name">Player 2</div>
                <div id="p2-score" class="score">0</div>
                <div class="turn-indicator">Your Turn</div>
            </div>
        </div>

        <div id="grid" class="grid"></div>

        <button id="restart-btn">Restart</button>
    </div>

    <div id="resultModal" class="custom-modal">
        <div class="modal-content">
            <h2>🎉 GAME OVER 🎉</h2>
            <p id="winnerText">Player 1 Wins!</p>
            <button id="modalPlayAgain" class="modal-btn">Play Again</button>
        </div>
    </div>

    <script>
        const emojis = ['🧠', '🧠', '⚡', '⚡', '⭐', '⭐', '🔥', '🔥', '👑', '👑', '💎', '💎', '🍀', '🍀', '🎯', '🎯'];
        let shuffledEmojis = [];
        let flippedCards = [];
        let scores = { p1: 0, p2: 0 };
        let activePlayer = 'p1';
        let canFlip = true;

        // Creating a pool of 3 flip sounds to allow rapid successive plays
        const flipSounds = [
            new Audio('flip.mp3'),
            new Audio('flip.mp3'),
            new Audio('flip.mp3')
        ];
        let flipIndex = 0;

        const matchSound = new Audio('match.mp3');
        const wrongSound = new Audio('wrong.mp3');
        const winSound = new Audio('win.mp3');

        const gridElement = document.getElementById('grid');
        const p1ScoreElement = document.getElementById('p1-score');
        const p2ScoreElement = document.getElementById('p2-score');
        const p1Box = document.getElementById('p1-box');
        const p2Box = document.getElementById('p2-box');
        const restartBtn = document.getElementById('restart-btn');
        
        const resultModal = document.getElementById('resultModal');
        const winnerText = document.getElementById('winnerText');
        const modalPlayAgain = document.getElementById('modalPlayAgain');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            gridElement.innerHTML = '';
            shuffledEmojis = shuffle([...emojis]);
            flippedCards = [];
            scores = { p1: 0, p2: 0 };
            activePlayer = 'p1';
            canFlip = true;

            p1ScoreElement.textContent = '0';
            p2ScoreElement.textContent = '0';
            p1Box.className = 'player-box active';
            p2Box.className = 'player-box';
            
            resultModal.style.display = 'none'; 

            for (let i = 0; i < 16; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.textContent = '?';
                card.addEventListener('click', handleCardClick);
                gridElement.appendChild(card);
            }
        }

        function playFlipSound() {
            // Rotates through the audio pool to overlap sounds perfectly
            const sound = flipSounds[flipIndex];
            sound.currentTime = 0;
            sound.play().catch(err => console.log("Sound error"));
            flipIndex = (flipIndex + 1) % flipSounds.length;
        }

        function handleCardClick(e) {
            const card = e.target;
            const index = card.dataset.index;

            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }

            // Trigger the multi-pool flip sound instantly
            playFlipSound();

            card.classList.add('flipped');
            card.textContent = shuffledEmojis[index];
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canFlip = false;
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const val1 = shuffledEmojis[card1.dataset.index];
            const val2 = shuffledEmojis[card2.dataset.index];

            if (val1 === val2) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                scores[activePlayer]++;
                updateScores();
                matchSound.currentTime = 0;
                matchSound.play().catch(err => console.log("Sound error"));
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.textContent = '?';
                card2.textContent = '?';
                wrongSound.currentTime = 0;
                wrongSound.play().catch(err => console.log("Sound error"));
                switchPlayer();
            }

            flippedCards = [];
            canFlip = true;
            checkGameOver();
        }

        function switchPlayer() {
            activePlayer = activePlayer === 'p1' ? 'p2' : 'p1';
            if (activePlayer === 'p1') {
                p1Box.classList.add('active');
                p2Box.classList.remove('active');
            } else {
                p2Box.classList.add('active');
                p1Box.classList.remove('active');
            }
        }

        function updateScores() {
            p1ScoreElement.textContent = scores.p1;
            p2ScoreElement.textContent = scores.p2;
        }

        function checkGameOver() {
            const matchedCards = document.querySelectorAll('.card.matched');
            if (matchedCards.length === 16) {
                setTimeout(() => {
                    winSound.currentTime = 0;
                    winSound.play().catch(err => console.log("Sound error"));

                    if (scores.p1 > scores.p2) {
                        winnerText.textContent = '🏆 Player 1 Wins! 🏆';
                    } else if (scores.p2 > scores.p1) {
                        winnerText.textContent = '🏆 Player 2 Wins! 🏆';
                    } else {
                        winnerText.textContent = '🤝 It\'s a Tie! 🤝';
                    }
                    resultModal.style.display = 'flex';
                }, 300);
            }
        }

        restartBtn.addEventListener('click', initGame);
        modalPlayAgain.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
